<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c47c|-|m31fY0uc4n</title>
    <style>
        body {
            background-color: #030813;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            text-transform: lowercase;
        }

        .char {
            display: inline-block;
        }

        .char.resolved {
            color: #ffffff;
            text-shadow: 0 0 10px #00f3ff;
        }
    </style>
</head>
<body>

    <h1 id="hacker-text"></h1>

    <script>
        const targetString = "c47c|-|m31fY0uc4n";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*|/-_";
        const container = document.getElementById("hacker-text");

        let audioCtx = null;
        let animationStarted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playGlitchSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100 + Math.random() * 400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playDingSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2400, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        // Build character spans
        targetString.split('').forEach(() => {
            const span = document.createElement('span');
            span.className = 'char';
            span.textContent = chars[Math.floor(Math.random() * chars.length)];
            container.appendChild(span);
        });

        const charSpans = container.querySelectorAll('.char');

        function startHackerAnimation() {
            if (animationStarted) return;
            animationStarted = true;

            initAudio();
            let currentIndex = 0;
            
            const interval = setInterval(() => {
                playGlitchSound();

                for (let i = currentIndex; i < targetString.length; i++) {
                    charSpans[i].textContent = chars[Math.floor(Math.random() * chars.length)];
                }

                if (currentIndex < targetString.length) {
                    charSpans[currentIndex].textContent = targetString[currentIndex];
                    charSpans[currentIndex].classList.add('resolved');
                    playDingSound();
                    currentIndex++;
                } else {
                    clearInterval(interval);
                }
            }, 80);
        }

        // Attempt autoplay immediately, with fallback to user interaction if blocked by browser policies
        window.addEventListener('DOMContentLoaded', () => {
            startHackerAnimation();
        });

        // Fallback for strict modern browser autoplay blocks
        ['click', 'keydown', 'touchstart'].forEach(event => {
            window.addEventListener(event, startHackerAnimation, { once: true });
        });
    </script>
</body>
</html>
